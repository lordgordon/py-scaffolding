[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/py_scaffolding",
]

[project]
name = "py-scaffolding"
version = "0.0.0"
dependencies = [
    "pydantic-settings~=2.12",
    "pydantic~=2.12",
    "structlog~=25.5",
]
requires-python = ">=3.14"
authors = [
  { name = "Nicholas Fiorentini", email = "lordgordon@users.noreply.github.com" },
]
# maintainers = []
description = "Empty project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scaffolding-repo"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 5 - Production/Stable",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "coverage[toml]~=7.11",
    "Faker~=40.15",
    "hypothesis~=6.131",
    "ipdb~=0.13",
    "ipython~=9.0",
    "mypy~=1.18",
    "pip-audit~=2.9",
    "pip~=26.0",
    "pre-commit~=4.3",
    "pytest~=9.0",
    "ruff~=0.14",
    "Sphinx~=9.1",
]

[project.urls]
Homepage = "https://github.com/lordgordon/py-scaffolding"

[tool.pytest.ini_options]
minversion = "8.4"
python_files = "tests.py test_*.py *_tests.py"
norecursedirs = ".* *.egg venv"
junit_family = "xunit2"

[tool.coverage.run]
branch = true
omit=[
    "*/__main__.py",
    "*/docs/*",
    "*/virtualenvs/*",
    "*/venv/*",
]
source = [
  "./"
]

[tool.coverage.report]
exclude_lines =[
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
sort = "Cover"
fail_under = 99

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

enable_error_code = [
  "truthy-bool",
]

check_untyped_defs = true
disallow_any_explicit = true
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
extra_checks = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_error_codes = true
strict = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
  ".venv",
  "docs",
]

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "RUF",
    # Pylint
    "PL",
    # pyupgrade
    "UP",
    # isort
    "I",
    # code complexity
    "C90",
    # specific languages
    "NPY",
    "PD",
    # naming conventions
    "N",
    # documentation
    "D",
    # Pyflake
    "F",
    # various flake8 rules
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "FBT",
    "G",
    "ICN",
    "LOG",
    "PIE",
    "PT",
    "PTH",
    "Q",
    "RET",
    "S",
    "SIM",
    "SIM",
    "T20",
    "TC",
]
ignore = [
  # nitpick comment style
  "D203", # incorrect-blank-line-before-class
  "D205", # blank line required between summary line and description
  "D212", # multi-line-summary-first-line
  "D401", # non-imperative-mood
  "D413", # Missing blank line after last section
  "PLR0913", # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "D", # we don't care about docstrings in unit tests
  "PLR2004", # Magic value used in comparison
  "S101", # assert are necessary in pytest
  "TC001", "TC002", "TC003", # Move imports into a type-checking block. Those are fine in unit test code.
]
